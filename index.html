<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINGS – נדל״ן יוקרה בירושלים</title>
<link rel="icon" href="img/brand/kings-icon.svg" type="image/svg+xml">
<meta name="description" content="KINGS Jerusalem Luxury Real Estate – נכסי יוקרה למכירה בשכונות המבוקשות של ירושלים">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: modern Jerusalem boutique agency – photo first, quiet type, lots of white
   IDEA: a gallery wall of homes; the photos carry the page, type and gold rules frame them
   PICTURE: full-bleed crossfading hero of KINGS listings (drawn Old City at dusk when photos are unavailable)
   COLOUR+TYPE: white & warm limestone, near-black ink, KINGS navy for depth, KINGS gold as the only accent; Heebo light for display, Frank Ruhl Libre for prices & numbers
   LAYOUT: transparent header over hero → stats strip → featured carousel → grid → neighborhoods mosaic → team → CTA */
:root{color-scheme:light dark;
--navy:#0a1c33;--gold:#b8933a;--gold2:#d6b25a;
--bg:light-dark(#ffffff,#0b1626);--alt:light-dark(#f5f1ea,#0f1d31);--card:light-dark(#ffffff,#122238);
--ink:light-dark(#151a21,#efe9de);--mute:light-dark(#6a717b,#9ea8b5);--line:light-dark(#e7e1d6,#22344d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.65 Heebo,system-ui,sans-serif;font-weight:400;overflow-x:clip}
h1,h2,h3{font-weight:300;line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(30px,3.8vw,46px)}h3{font-size:20px;font-weight:500;line-height:1.3}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:500}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(4vw,18px)}
.band{padding:clamp(56px,8vw,110px) 0}
.alt{background:var(--alt)}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.head p{margin:10px 0 0;color:var(--mute);max-width:56ch}
.rule{display:block;width:48px;height:1px;background:var(--gold);margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border:1px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.solid{background:var(--ink);color:var(--bg)}.btn.solid:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}.btn.gold:hover{background:var(--navy);border-color:var(--navy)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.light{border-color:#fff;color:#fff}.btn.light:hover{background:#fff;color:var(--navy)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
/* header */
header{position:fixed;top:0;inset-inline:0;z-index:40;transition:background .3s,box-shadow .3s,color .3s;color:var(--ink);background:var(--bg);box-shadow:0 1px 0 var(--line)}
header.clear{background:transparent;box-shadow:none;color:#fff}
.hdr{display:flex;align-items:center;gap:28px;height:78px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{height:46px;width:auto;display:block}.logo .lk-l{display:none}header.clear .logo .lk-d{display:none}header.clear .logo .lk-l{display:block}
.flogo img{width:190px;height:auto;display:block;margin-bottom:18px}
.logo b{font-family:"Frank Ruhl Libre",serif;font-weight:500;font-size:25px;letter-spacing:.18em;line-height:1;display:block}
.logo small{display:block;font-size:11px;letter-spacing:.08em;opacity:.75;margin-top:4px}
nav{display:flex;gap:6px;margin-inline-start:auto}
nav a{text-decoration:none;padding:10px 12px;font-size:15.5px;position:relative}
nav a::after{content:"";position:absolute;inset-inline:12px;bottom:4px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
nav a.on::after,nav a:hover::after{transform:scaleX(1)}
.hbtns{display:flex;gap:8px;align-items:center}
.lang{background:none;border:1px solid currentColor;min-height:40px;padding:0 14px;cursor:pointer;font-size:14px;opacity:.85}
.menu{display:none;background:none;border:0;min-width:44px;min-height:44px;cursor:pointer;color:inherit}
.spacer{height:78px}
/* hero */
.hero{position:relative;height:min(100svh,880px);min-height:600px;color:#fff;background:var(--navy);overflow:hidden;display:flex;align-items:flex-end}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
[dir=ltr] .hero .scene{transform:scaleX(-1)}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease,transform 8s ease;transform:scale(1.06)}
.slides img.on{opacity:1;transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0006 0%,#0000 30%,#0000 45%,#000a 100%)}
.hero .wrap{position:relative;z-index:2;width:100%;padding-bottom:clamp(36px,6vw,72px)}
.hero h1{font-size:clamp(38px,6vw,78px);font-weight:200;max-width:15ch}
.hero h1 b{font-weight:500;color:var(--gold2)}
.hero p{font-size:clamp(17px,1.6vw,20px);font-weight:300;max-width:48ch;margin:16px 0 30px;opacity:.92}
.search{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;background:#ffffffeb;backdrop-filter:blur(10px);color:#151a21;max-width:1040px}
.search label{padding:12px 20px 10px;border-inline-end:1px solid #e3ddd2;display:block;cursor:pointer}
.search label span{display:block;font-size:12.5px;color:#7a818b;letter-spacing:.02em}
.search select{width:100%;border:0;background:transparent;min-height:30px;font-size:16px;padding:0;cursor:pointer;color:#151a21}
.search .btn{border:0;min-height:auto;padding:0 34px}
.hero-dots{position:absolute;z-index:3;bottom:28px;inset-inline-end:max(4vw,18px);display:flex;gap:8px}
.hero-dots button{width:28px;height:2px;border:0;padding:0;background:#fff6;cursor:pointer}
.hero-dots button.on{background:#fff}
.hero-cap{position:absolute;z-index:3;top:110px;inset-inline-end:max(4vw,18px);font-size:13px;text-decoration:none;color:#fff;opacity:.85;border-bottom:1px solid #fff8;padding-bottom:2px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.stats div{padding:34px 20px;text-align:center;border-inline-end:1px solid var(--line)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:clamp(32px,3.6vw,46px);line-height:1;color:var(--gold)}
.stats span{display:block;margin-top:8px;color:var(--mute);font-size:15px}
/* carousel */
.car{position:relative}
.ctrack{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.ctrack::-webkit-scrollbar{display:none}
.big{flex:0 0 min(78vw,560px);scroll-snap-align:start;position:relative;aspect-ratio:4/5;overflow:hidden;color:#fff;text-decoration:none;background:var(--navy)}
.big .pic{position:absolute;inset:0}
.big .pic img{transition:transform 1s}
.big:hover .pic img{transform:scale(1.04)}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#000c)}
.big .txt{position:absolute;z-index:2;inset-inline:26px;bottom:24px}
.big .txt small{color:var(--gold2);font-size:14px;letter-spacing:.03em}
.big .txt h3{font-size:clamp(20px,2vw,26px);font-weight:300;margin:6px 0 10px}
.big .txt .num{font-size:24px}
.arrows{display:flex;gap:8px}
.arrows button{width:48px;height:48px;border:1px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center}
.arrows button:hover{background:var(--ink);color:var(--bg)}
[dir=rtl] .flip{transform:scaleX(-1)}[dir=ltr] .flipl{transform:scaleX(-1)}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:34px 26px}
.card{display:flex;flex-direction:column;text-decoration:none;background:var(--card)}
.photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--navy)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .pic img{transition:transform .8s}
.card:hover .pic img{transform:scale(1.05)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 55%,#000b);pointer-events:none}
.photo .price{position:absolute;z-index:2;bottom:14px;inset-inline-start:18px;color:#fff;font-size:26px;line-height:1}
.photo .price small{display:block;font-family:Heebo,sans-serif;font-size:12.5px;font-weight:400;opacity:.85;margin-bottom:4px}
.ribbon{position:absolute;z-index:2;top:16px;inset-inline-start:0;background:var(--gold);color:#fff;font-size:12.5px;letter-spacing:.04em;padding:5px 14px}
.ribbon.new{background:var(--navy)}
.fav{position:absolute;z-index:3;top:10px;inset-inline-end:10px;width:44px;height:44px;border-radius:50%;border:0;background:#fffe;color:#151a21;cursor:pointer;display:grid;place-items:center}
.fav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6}
.fav.on svg{fill:var(--gold);stroke:var(--gold)}
.cb{padding:18px 4px 0;display:flex;flex-direction:column;gap:4px;flex:1}
.cb .where{font-size:13.5px;color:var(--gold);letter-spacing:.02em}
.cb h3{font-weight:400;font-size:18.5px}
.specs{display:flex;gap:4px 22px;flex-wrap:wrap;margin-top:14px;padding:14px 0 4px;border-top:1px solid var(--line);color:var(--mute);font-size:14.5px}
.specs span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.specs .ico{width:18px;height:18px}
/* fallback picture */
.fb{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 70% 10%,#1d3a5f,#0a1c33 60%);color:var(--gold2);text-align:center}
.fb svg{width:46px;height:46px;display:block;margin:0 auto 10px;opacity:.9}
.fb span{font-family:"Frank Ruhl Libre",serif;font-size:19px}
/* projects split */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--navy);color:#fff;margin-bottom:2px}
.split .photo{aspect-ratio:auto;min-height:440px}
.split .photo::after{display:none}
.split .txt{padding:clamp(32px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.split .txt small{color:var(--gold2);letter-spacing:.06em}
.split .txt p{color:#c8cfd8;margin:0;font-weight:300;max-width:50ch}
.split.rev .photo{order:2}
/* neighborhoods mosaic */
.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:230px;gap:12px}
.tile{position:relative;overflow:hidden;text-decoration:none;color:#fff;background:var(--navy)}
.tile:nth-child(1){grid-column:span 2;grid-row:span 2}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 40%,#000a)}
.tile .pic img{transition:transform .9s}.tile:hover .pic img{transform:scale(1.06)}
.tile div.t{position:absolute;z-index:2;bottom:18px;inset-inline-start:20px}
.tile b{display:block;font-weight:300;font-size:clamp(21px,2vw,28px)}
.tile span{font-size:14px;opacity:.85}
/* search band */
.finder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:12px;margin-top:28px}
.finder select,.filters select{min-height:52px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;width:100%}
/* listings page */
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:8px 0 18px}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
.toggles{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 0;border-block:1px solid var(--line);margin-bottom:34px}
.toggles div{display:flex;gap:10px;flex-wrap:wrap}
.pill{min-height:42px;padding:0 18px;border:1px solid var(--line);background:transparent;cursor:pointer;border-radius:30px;font-size:15px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--mute);font-size:15px}
.empty{padding:60px;text-align:center;border:1px dashed var(--line);color:var(--mute)}
.pagehead{padding:clamp(40px,6vw,80px) 0 24px}
.pagehead h1{font-size:clamp(34px,4.6vw,58px)}
/* property */
.mos{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:260px 260px;gap:8px;margin-top:8px;position:relative}
.mos button{position:relative;border:0;padding:0;cursor:zoom-in;overflow:hidden;background:var(--navy)}
.mos button:first-child{grid-row:span 2}
.mos .all{position:absolute;z-index:3;bottom:16px;inset-inline-end:16px;background:#fff;color:#151a21;border:0;min-height:44px;padding:0 18px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:15px}
.ptitle{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding:34px 0 26px;border-bottom:1px solid var(--line)}
.ptitle h1{font-size:clamp(28px,3.4vw,42px)}
.ptitle .where{color:var(--gold);margin-bottom:10px;display:flex;gap:8px;align-items:center;font-size:15px}
.ptitle .num{font-size:clamp(28px,3vw,38px);white-space:nowrap}
.ptitle .note{color:var(--mute);font-size:14px;text-align:end}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:64px;align-items:start;padding:34px 0 80px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:40px}
.facts>div{background:var(--bg);padding:18px;display:flex;gap:12px;align-items:center}
.facts .ico{width:26px;height:26px;color:var(--gold)}
.facts b{display:block;font-size:21px;font-weight:500;line-height:1.1}
.facts span{font-size:13.5px;color:var(--mute)}
.sect{margin-bottom:40px}
.sect h3{font-size:22px;font-weight:300;margin-bottom:14px}
.desc{white-space:pre-line;max-width:70ch;margin:0}
.callout{background:var(--alt);border-inline-start:2px solid var(--gold);padding:16px 20px;margin-top:20px}
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 20px;padding:0;margin:0;list-style:none}
.amen li{display:flex;align-items:center;gap:10px}
.amen li::before{content:"";width:6px;height:6px;background:var(--gold);transform:rotate(45deg);flex:none}
aside.side{position:sticky;top:100px;border:1px solid var(--line);padding:28px;background:var(--card)}
aside.side h3{font-weight:300;font-size:22px;margin-bottom:6px}
.agent{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.av{width:58px;height:58px;border-radius:50%;flex:none;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font-family:"Frank Ruhl Libre",serif;font-size:20px;overflow:hidden;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.agent small{display:block;color:var(--mute);direction:ltr;unicode-bidi:isolate;text-align:start}
.side .btn{width:100%;margin-top:12px}
.minis{display:flex;gap:8px;margin-top:12px}.minis .btn{flex:1;padding:0 10px;margin:0}
.crumbs{font-size:14px;color:var(--mute);padding-top:22px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--gold)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:#05080ef2;display:none;flex-direction:column}
.lb.open{display:flex}
.lb .bar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:14px 20px}
.lb .bar button{background:none;border:0;color:#fff;font-size:28px;min-width:48px;min-height:48px;cursor:pointer}
.lbtrack{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lbtrack::-webkit-scrollbar{display:none}
.lbtrack .s{flex:0 0 100%;scroll-snap-align:center;position:relative}
.lbtrack .s img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lb .nav{position:absolute;top:50%;width:52px;height:52px;border-radius:50%;border:0;background:#fff;cursor:pointer;display:grid;place-items:center;color:#151a21}
.lb .nav.p{inset-inline-start:20px}.lb .nav.n{inset-inline-end:20px}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:40px 26px}
.member{text-align:center}
.member .av{width:150px;height:150px;font-size:42px;margin:0 auto 18px}
.member h3{font-weight:400}
.member p{margin:2px 0;color:var(--mute);font-size:14.5px}
.member .links{display:flex;gap:8px;justify-content:center;margin-top:14px}
.member .links a{width:44px;height:44px;border:1px solid var(--line);display:grid;place-items:center;border-radius:50%}
.member .links a:hover{border-color:var(--gold);color:var(--gold)}
/* cta, contact */
.cta{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.cta .wrap{position:relative;display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between}
.cta p{color:#c8cfd8;margin:10px 0 0;font-weight:300}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px}
form.lead-f{display:grid;gap:14px}
form.lead-f input,form.lead-f select,form.lead-f textarea{width:100%;min-height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 2px;font-size:16px}
form.lead-f textarea{min-height:110px;resize:vertical}
form.lead-f input:focus,form.lead-f textarea:focus{outline:0;border-color:var(--gold)}
.ok{background:#e8f5ec;color:#14532d;padding:14px 16px}
.cinfo{display:grid;gap:22px;margin-top:34px}
.cinfo div{display:flex;gap:14px;align-items:flex-start}
.cinfo .ico{color:var(--gold);width:22px;height:22px;margin-top:3px}
.cinfo b{display:block;font-weight:500}
.ltr{direction:ltr;unicode-bidi:isolate}
/* side tabs + mobile bar */
.tabs{position:fixed;z-index:35;top:50%;inset-inline-end:0;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
.tabs a{width:52px;height:52px;display:grid;place-items:center;background:var(--gold);color:#fff;text-decoration:none}
.tabs a.w{background:#1fa855}
.tabs a:hover{background:var(--navy)}
.mbar{display:none}
footer{background:#070f1b;color:#a7b0bc;padding:72px 0 28px;font-size:15px}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:36px}
footer h4{color:#fff;margin:0 0 14px;font-weight:400;font-size:16px}
footer a{display:block;text-decoration:none;padding:4px 0}footer a:hover{color:var(--gold2)}
footer .logo{color:#fff;margin-bottom:16px}
.copy{border-top:1px solid #1a2636;margin-top:48px;padding-top:20px;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

function viewHome(){

  const projects=P.filter(p=>p.property_type==='new_project');
  const hoods=Object.keys(HOODS).map(k=>[k,P.filter(p=>p.neighborhood===k)]).filter(x=>x[1].length).sort((a,b)=>b[1].length-a[1].length).slice(0,5);
  const heroP=CONFIG.HERO.map(id=>P.find(p=>p.id===id)).filter(Boolean);
  const value=P.reduce((s,p)=>s+(p.price||0),0);

  <div class="wrap"><h1>${t('heroA')} <b>${t('heroB')}</b></h1><p>${t('heroP')}</p>
  <form class="search" id="heroSearch">${selects(true)}<button class="btn solid">${ic('search')}${t('search')}</button></form></div>

  <section class="stats wrap"><div><b class="num">${P.length}</b><span>${t('stActive')}</span></div><div><b class="num">${P.filter(p=>p.exclusive).length}</b><span>${t('stExcl')}</span></div>
   <div><b class="num">${new Set(P.map(p=>p.neighborhood)).size}</b><span>${t('stHoods')}</span></div><div><b class="num">${shortMoney(value)}</b><span>${t('stValue')}</span></div></section>
  <section class="band"><div class="wrap"><div class="head"><div><span class="rule"></span><h2>${t('featured')}</h2><p>${t('featuredP')}</p></div>
   <div class="arrows"><button data-car="-1" aria-label="prev">${ic('arrow','ico flipl')}</button><button data-car="1" aria-label="next">${ic('arrow','ico flip')}</button></div></div>
   <div class="car"><div class="ctrack" id="car">${ex.map(bigCard).join('')}</div></div></div></section>
  ${projects.map((p,i)=>`<section class="split ${i%2?'rev':''}"><div class="photo">${pic(p.images[0],L(HOODS[p.neighborhood]),false,cover(p))}</div><div class="txt"><small>${t('projH')} · ${esc(L(HOODS[p.neighborhood]))}</small><h2>${esc(f(p,'title'))}</h2><p>${esc(f(p,'description').split('\n').filter(Boolean).slice(1,2).join(''))}</p><div class="num" style="font-size:22px">${esc(p['price_note_'+lang]||money(p.price))}</div><p><a class="btn light" href="#p-${esc(p.id)}">${t('projBtn')} ${ic('arrow','ico flip')}</a></p></div></section>`).join('')}
  <section class="band"><div class="wrap"><div class="head"><div><span class="rule"></span><h2>${t('latest')}</h2><p>${t('latestP')}</p></div><a class="btn" href="#listings">${t('all')} (${P.length})</a></div>
   <div class="grid">${latest.map(card).join('')}</div></div></section>
  <section class="band alt"><div class="wrap"><div class="head"><div><span class="rule"></span><h2>${t('findH')}</h2></div></div>
   <form class="finder" id="finder">${selects(false)}<button class="btn solid">${ic('search')}${t('search')}</button></form></div></section>

const cta=()=>`<section class="band cta"><div class="wrap"><div><h2>${t('ctaH')}</h2><p>${t('ctaP')}</p></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn gold" href="#contact">${t('contact')}</a><a class="btn light" href="${wa(CONFIG.OFFICE_WA)}" target="_blank" rel="noopener">${ic('wa')}${t('waAsk')}</a></div></div></section>`;

const avatar=a=>`<div class="av">${esc(initials(a))}${a.photo?`<img class="avimg" src="${esc(img(a.photo))}" alt="">`:''}</div>`;
const member=a=>`<div class="member">${avatar(a)}<h3>${esc(f(a,'name'))}</h3><p>${esc(a['role_'+lang]||(lang==='he'?'סוכן/ת נדל״ן':'Real estate agent'))}</p><p class="ltr">${esc(telFmt(a.phone))}</p>
  <div class="links"><a href="${wa(a.whatsapp||a.phone)}" target="_blank" rel="noopener" aria-label="WhatsApp">${ic('wa')}</a><a href="tel:${esc(a.phone)}" aria-label="${t('call')}">${ic('phone')}</a><a href="mailto:${esc(a.email)}" aria-label="${t('email')}">${ic('mail')}</a></div></div>`;

function filtered(){
  let r=P.filter(p=>(!F.hood||p.neighborhood===F.hood)&&(!F.type||p.property_type===F.type)&&(!F.max||p.price<=+F.max)&&(!F.beds||(p.bedrooms||0)>=+F.beds)&&(!F.excl||p.exclusive)&&(!F.fav||favs.includes(p.id)));
  if(F.sort==='low')r=[...r].sort((a,b)=>(a.price||9e9)-(b.price||9e9));if(F.sort==='high')r=[...r].sort((a,b)=>(b.price||0)-(a.price||0));if(F.sort==='size')r=[...r].sort((a,b)=>b.sqm-a.sqm);
  return r}
const viewListings=()=>`<div class="spacer"></div><section class="wrap"><div class="pagehead"><span class="rule"></span><h1>${F.hood?esc(L(HOODS[F.hood])):t('listings')}</h1></div>
  <form class="filters" id="filters">${selects(true).replace(/<label>/g,'<label>')}<label><span>${t('sort')}</span><select name="sort">${[['rec','sNew'],['low','sLow'],['high','sHigh'],['size','sSize']].map(([v,k])=>`<option value="${v}" ${F.sort===v?'selected':''}>${t(k)}</option>`).join('')}</select></label></form>
  <div class="toggles"><div><button class="pill ${F.excl?'on':''}" data-tog="excl" aria-pressed="${F.excl}">${t('excl')}</button><button class="pill ${F.fav?'on':''}" data-tog="fav" aria-pressed="${F.fav}">${ic('heart','ico')} ${t('onlyFav')}</button><button class="pill" id="reset">${t('reset')}</button></div><span class="count" id="count"></span></div>
  <div id="results" style="padding-bottom:90px"></div></section>`;
function renderResults(){const r=filtered();$('#count').textContent=r.length+' '+t('results');$('#results').innerHTML=r.length?`<div class="grid">${r.map(card).join('')}</div>`:`<div class="empty">${t('none')}</div>`}

function viewProperty(id){
  const p=P.find(x=>x.id===id);if(!p)return viewListings();
  const hood=L(HOODS[p.neighborhood]),title=f(p,'title');
  const agents=[p.agent_id,...(p.co_agent_ids||[])].filter((v,i,a)=>v&&a.indexOf(v)===i).map(agentBy).filter(Boolean);
  if(!agents.length)agents.push(A[0]);
  const url=location.href.split('#')[0]+'#p-'+p.id,msg=t('waMsg')+title+' – '+url;
  lbImgs=p.images;lbCover=cover(p);
  const facts=[['area',p.sqm,t('sqm')],p.bedrooms&&['bed',p.bedrooms,t('beds')],p.bathrooms&&['bath',p.bathrooms,t('baths')],p.floor!=null&&['floor',p.floor===0?t('ground'):p.floor+(p.total_floors?' '+t('of')+' '+p.total_floors:''),t('floor')],p.year_built&&['cal',p.year_built,t('year')]].filter(Boolean);
  const sim=P.filter(x=>x.neighborhood===p.neighborhood&&x.id!==p.id).concat(P.filter(x=>x.neighborhood!==p.neighborhood&&x.property_type===p.property_type)).filter(x=>x.id!==p.id).slice(0,3);
  const mapQ=p.address&&p.address.length>3?'https://www.google.com/maps/search/'+encodeURIComponent(p.address+', ירושלים'):'';
  return `<div class="spacer"></div><div class="wrap"><div class="crumbs"><a href="#listings">${t('listings')}</a> / <a href="#hood-${p.neighborhood.replace(/_/g,'-')}">${esc(hood)}</a></div>
  <div class="mos">${p.images.slice(0,5).map((s,i)=>`<button data-open="${i}" aria-label="${i+1}">${pic(s,i?'':hood,i===0,i?'':cover(p))}</button>`).join('')}
   <button class="all" data-open="0">${ic('grid')}${t('allPh')} (${p.images.length})</button></div>
  <div class="ptitle"><div><div class="where">${ic('pin')}${esc(hood)} · ${esc(L(TYPES[p.property_type]))}${p.exclusive?' · '+t('exclusive'):''}</div><h1>${esc(title)}</h1></div>
   <div><div class="num">${money(p.price)}</div>${p['price_note_'+lang]?`<div class="note">${esc(p['price_note_'+lang])}</div>`:''}</div></div>
  <div class="pgrid"><div>
   <div class="facts">${facts.map(([i,b,s])=>`<div>${ic(i)}<div><b>${esc(b)}</b><span>${esc(s)}</span></div></div>`).join('')}</div>
   <div class="sect"><h3>${t('details')}</h3><p class="desc">${esc(f(p,'description'))}</p>${f(p,'features')?`<div class="callout"><b>${t('inv')}:</b> ${esc(f(p,'features'))}</div>`:''}</div>
   <div class="sect"><h3>${t('amen')}</h3><ul class="amen">${p.amenities.map(a=>`<li>${esc(L(AMEN[a])||a)}</li>`).join('')}</ul></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap">${p.video_url?`<a class="btn" href="${esc(p.video_url)}" target="_blank" rel="noopener">${ic('play')}${t('video')}</a>`:''}${mapQ?`<a class="btn" href="${esc(mapQ)}" target="_blank" rel="noopener">${ic('pin')}${t('map')}</a>`:''}</div></div>
  <aside class="side"><h3>${t('agentH')}</h3><p style="margin:0 0 6px;color:var(--mute);font-size:15px">${t('agentP')}</p>
   ${agents.map(a=>`<div class="agent">${avatar(a)}<div><b style="font-weight:500">${esc(f(a,'name'))}</b><small>${esc(telFmt(a.phone))}</small></div></div>`).join('')}
   <a class="btn wa" href="${wa(agents[0].whatsapp||agents[0].phone,msg)}" target="_blank" rel="noopener">${ic('wa')}${t('waAsk')}</a>
   <div class="minis"><a class="btn" href="tel:${esc(agents[0].phone)}">${ic('phone')}${t('call')}</a><button class="btn" id="copyLink" data-url="${esc(url)}">${ic('share')}${t('copy')}</button><button class="btn" data-fav="${esc(p.id)}" aria-pressed="${favs.includes(p.id)}" aria-label="${t('favorites')}">${ic('heart')}</button></div></aside></div></div>
  ${sim.length?`<section class="band alt"><div class="wrap"><div class="head"><div><span class="rule"></span><h2>${t('similar')}</h2></div></div><div class="grid">${sim.map(card).join('')}</div></div></section>`:''}`}

const viewTeam=()=>`<div class="spacer"></div><section class="wrap"><div class="pagehead"><span class="rule"></span><h1>${t('teamH')}</h1><p style="color:var(--mute)">${t('teamP')}</p></div><div class="team" style="padding:20px 0 100px">${A.map(member).join('')}</div></section>${cta()}`;
const viewAbout=()=>`<div class="spacer"></div><section class="band"><div class="wrap two"><div><span class="rule"></span><h1 style="font-size:clamp(32px,4vw,50px)">${t('aboutH')}</h1><p style="font-size:19px;font-weight:300;color:var(--mute);margin-top:20px">${t('aboutP')}</p></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:36px 28px;align-content:center">${t('why').map(w=>`<div><span class="rule"></span><h3>${w[0]}</h3><p style="color:var(--mute);margin:6px 0 0">${w[1]}</p></div>`).join('')}</div></div></section>
  <section class="stats wrap" style="border-top:1px solid var(--line)"><div><b class="num">${P.length}</b><span>${t('stActive')}</span></div><div><b class="num">${A.length}</b><span>${t('team')}</span></div><div><b class="num">${new Set(P.map(p=>p.neighborhood)).size}</b><span>${t('stHoods')}</span></div><div><b class="num">2</b><span>${lang==='he'?'שפות שירות':'Service languages'}</span></div></section>

const viewContact=()=>`<div class="spacer"></div><section class="band"><div class="wrap two"><div><span class="rule"></span><h1 style="font-size:clamp(32px,4vw,50px)">${t('cH')}</h1><p style="color:var(--mute);font-size:18px;font-weight:300">${t('cP')}</p>

  <div>${ic('mail')}<div><b>${t('email')}</b><a href="mailto:${CONFIG.EMAIL}">${CONFIG.EMAIL}</a></div></div><div>${ic('wa')}<div><b>WhatsApp</b><a class="ltr" href="${wa(CONFIG.OFFICE_WA)}" target="_blank" rel="noopener">${telFmt(CONFIG.OFFICE_WA)}</a></div></div></div></div>
  <form class="lead-f" id="leadForm"><input name="name" required placeholder="${t('name')}" autocomplete="name"><input name="phone" required type="tel" placeholder="${t('phone')}" autocomplete="tel">
  <input name="email" type="email" placeholder="${t('email')}" autocomplete="email"><select name="interest" aria-label="${t('interest')}">${['iBuy','iSell','iInvest','iOther'].map(k=>`<option>${t(k)}</option>`).join('')}</select>
  <textarea name="msg" placeholder="${t('msg')}"></textarea><button class="btn wa" style="margin-top:10px">${ic('wa')}${t('send')}</button><div id="leadOk"></div></form></div></section>`;

function startHero(){clearInterval(heroTimer);const imgs=[...document.querySelectorAll('.slides img')];if(imgs.length<2||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  heroTimer=setInterval(()=>{const live=[...document.querySelectorAll('.slides img')];if(live.length<2)return clearInterval(heroTimer);const i=live.findIndex(x=>x.classList.contains('on'));showHero((i+1)%live.length)},6500)}
function showHero(i){const live=[...document.querySelectorAll('.slides img')];if(!live[i])return;live.forEach((x,j)=>x.classList.toggle('on',i===j));
  document.querySelectorAll('[data-hero]').forEach((b,j)=>b.classList.toggle('on',i===j));const p=P.find(x=>x.id===live[i].dataset.id);const c=$('#heroCap');if(p&&c){c.href='#p-'+p.id;c.textContent=f(p,'title')}}

function render(){
  const h=location.hash.slice(1)||'home';let html,cur=h;
  if(h.startsWith('p-')){html=viewProperty(h.slice(2));cur='listings'}
  else if(h.startsWith('hood-')){Object.assign(F,{hood:h.slice(5).replace(/-/g,'_'),type:'',max:'',beds:''});html=viewListings();cur='listings'}
  else if(h==='projects'){Object.assign(F,{hood:'',type:'new_project',max:'',beds:''});html=viewListings();cur='projects'}
  else html=({listings:viewListings,team:viewTeam,about:viewAbout,contact:viewContact}[h]||viewHome)();
  $('#app').innerHTML=html;
  if($('#results'))renderResults();
  $('#nav').innerHTML=['home','listings','projects','team','about','contact'].map(k=>`<a href="#${k}" class="${cur===k?'on':''}">${t(k)}</a>`).join('');
  $('#nav').classList.remove('open');
  document.body.dataset.view=cur;onScroll();startHero();window.scrollTo(0,0)}
function onScroll(){$('#hdr').classList.toggle('clear',document.body.dataset.view==='home'&&!location.hash.startsWith('#p-')&&scrollY<60&&!$('#nav').classList.contains('open'))}

function chrome(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';
  document.title=lang==='he'?'KINGS – נדל״ן יוקרה בירושלים':'KINGS – Jerusalem Luxury Real Estate';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#langBtn').textContent=lang==='he'?'EN':'עב';
  $('#fnav').innerHTML=`<h4>${t('nav')}</h4>`+['listings','projects','team','about','contact'].map(k=>`<a href="#${k}">${t(k)}</a>`).join('');
  $('#fhoods').innerHTML=`<h4>${t('hoodsH')}</h4>`+[...new Set(P.map(p=>p.neighborhood))].slice(0,6).map(k=>`<a href="#hood-${k.replace(/_/g,'-')}">${esc(L(HOODS[k]))}</a>`).join('');
  $('#fcontact').innerHTML=`<h4>${t('contact')}</h4><a>${lang==='he'?CONFIG.ADDRESS_HE:CONFIG.ADDRESS_EN}</a><a class="ltr" href="tel:${CONFIG.OFFICE_PHONE}">${telFmt(CONFIG.OFFICE_PHONE)}</a><a href="mailto:${CONFIG.EMAIL}">${CONFIG.EMAIL}</a>`;
  $('#tabs').innerHTML=`<a class="w" href="${wa(CONFIG.OFFICE_WA)}" target="_blank" rel="noopener" aria-label="WhatsApp">${ic('wa')}</a><a href="#listings" aria-label="${t('search')}">${ic('search')}</a><a href="#contact" aria-label="${t('contact')}">${ic('mail')}</a>`;
  $('#mbar').innerHTML=`<a href="tel:${CONFIG.OFFICE_PHONE}">${ic('phone')}${t('call')}</a><a class="w" href="${wa(CONFIG.OFFICE_WA)}" target="_blank" rel="noopener">${ic('wa')}${t('waAsk')}</a>`;
  $('#yr').textContent=new Date().getFullYear()}

function readForm(form){const d=Object.fromEntries(new FormData(form));F.hood=d.hood||'';F.type=d.type||'';F.max=d.max||'';F.beds=d.beds||'';if(form.id==='filters')F.sort=d.sort||'rec'}
function openLb(i){$('#lbTrack').innerHTML=lbImgs.map((s,j)=>`<div class="s">${pic(s,'',j===i,j?'':lbCover)}</div>`).join('');$('#lb').classList.add('open');document.body.style.overflow='hidden';
  const tr=$('#lbTrack');requestAnimationFrame(()=>{tr.children[i]?.scrollIntoView({inline:'center',block:'nearest'});lbCount()})}
function closeLb(){$('#lb').classList.remove('open');document.body.style.overflow=''}
function lbCount(){const tr=$('#lbTrack');$('#lbCount').textContent=(Math.round(Math.abs(tr.scrollLeft)/tr.clientWidth)+1)+' / '+lbImgs.length}
function step(el,d){const dir=getComputedStyle(el).direction==='rtl'?-1:1;el.scrollBy({left:d*dir*(el.id==='car'?el.firstElementChild.clientWidth+22:el.clientWidth),behavior:'smooth'})}

document.addEventListener('click',e=>{
  const fb=e.target.closest('[data-fav]');
  if(fb){e.preventDefault();e.stopPropagation();const id=fb.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];try{localStorage.setItem('kings-favs',JSON.stringify(favs))}catch(err){}
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{const on=favs.includes(id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);if(!b.classList.contains('fav'))b.style.color=on?'var(--gold)':''});if(F.fav&&$('#results'))renderResults();return}
  const q=s=>e.target.closest(s);
  if(q('[data-car]')){step($('#car'),+q('[data-car]').dataset.car);return}
  if(q('[data-hero]')){showHero(+q('[data-hero]').dataset.hero);startHero();return}
  if(q('[data-open]')){openLb(+q('[data-open]').dataset.open);return}
  if(q('[data-lb]')){step($('#lbTrack'),+q('[data-lb]').dataset.lb);return}
  if(q('#lbClose')){closeLb();return}
  if(q('[data-tog]')){const k=q('[data-tog]').dataset.tog;F[k]=!F[k];q('[data-tog]').classList.toggle('on',F[k]);q('[data-tog]').setAttribute('aria-pressed',F[k]);renderResults();return}
  if(q('#reset')){Object.assign(F,{hood:'',type:'',max:'',beds:'',excl:false,fav:false,sort:'rec'});location.hash==='#listings'?render():location.hash='listings';return}
  if(q('#copyLink')){const b=q('#copyLink');navigator.clipboard?.writeText(b.dataset.url).then(()=>{b.lastChild.textContent=t('copied')}).catch(()=>{});return}
  if(q('#menuBtn')){$('#nav').classList.toggle('open');onScroll();return}
  if(q('#langBtn')){lang=lang==='he'?'en':'he';try{localStorage.setItem('kings-lang',lang)}catch(err){}chrome();render()}});
document.addEventListener('change',e=>{const fm=e.target.closest('#filters');if(fm){readForm(fm);renderResults()}});
document.addEventListener('submit',e=>{e.preventDefault();const fm=e.target;
  if(fm.id==='heroSearch'||fm.id==='finder'){readForm(fm);F.excl=false;F.fav=false;location.hash='listings'}
  if(fm.id==='leadForm'){const d=Object.fromEntries(new FormData(fm));const link=wa(CONFIG.OFFICE_WA,`${d.name} | ${d.phone}${d.email?' | '+d.email:''}\n${d.interest}\n${d.msg||''}`);
    $('#leadOk').innerHTML=`<p class="ok">${t('sent')} <a href="${link}" target="_blank" rel="noopener">wa.me</a></p>`;window.open(link,'_blank','noopener')}});
document.addEventListener('scroll',e=>{if(e.target.id==='lbTrack')lbCount()},true);
window.addEventListener('scroll',onScroll,{passive:true});
document.addEventListener('keydown',e=>{if($('#lb').classList.contains('open')){if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft'||e.key==='ArrowRight')step($('#lbTrack'),(e.key==='ArrowRight'?1:-1)*(lang==='he'?-1:1))}});
window.addEventListener('hashchange',()=>{closeLb();render()});

Promise.all([fetch('data/properties.json').then(r=>r.json()),fetch('data/agents.json').then(r=>r.json())])
  .then(([p,a])=>{P=p;A=a;chrome();render()})
  .catch(()=>{$('#app').innerHTML='<section class="band"><div class="wrap"><p>Could not load listings.</p></div></section>'});
}
</script>
</body>
</html>
